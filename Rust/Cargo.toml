[package]
name = "tangiextract"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native extraction engines for TangiExtract"

[lib]
name = "tangiextract"
crate-type = ["staticlib", "rlib"]

[dependencies]
nsis = { git = "https://github.com/ATRAPSLLC/nsis-rs", rev = "ddab1fd304007cf5a2e1b4b6098a4055b49b48e5" }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

sevenz-rust2 = { version = "0.25", default-features = true }
bzip2 = "0.5"
xz2 = "0.1"

zstd = "0.13"
lz4_flex = { version = "0.11", features = ["frame"] }
